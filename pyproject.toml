[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "novatech-hr-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-ai[groq]>=2.29.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.2",
]

[project.scripts]
hrbot = "hrbot.cli.app:main"

[tool.setuptools]
packages = ["hrbot"]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
